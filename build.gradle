plugins {
    id 'java'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'com.hollingsworth'
            includeGroup 'com.hollingsworth.arsnouveau'
        }
    }
    maven {
        url = 'https://cursemaven.com/'
        content {
            includeGroup 'curse.maven'
        }
    }
}

configurations {
    neoForge
    compileClasspath.extendsFrom neoForge
}

dependencies {
    // NeoForge userdev provides all MC + NF deobfuscated classes for compilation
    neoForge 'net.neoforged:neoforge:21.0.109-beta:userdev'
    compileOnly 'com.hollingsworth.arsnouveau:ars_nouveau-1.21.1:5.10.6'
}

// Extract the NeoForge userdev JAR and its embedded dependencies
task extractNeoForge {
    def outputDir = layout.buildDirectory.dir('neoforge')
    outputs.dir(outputDir)
    
    doLast {
        copy {
            configurations.neoForge.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                from(zipTree(artifact.file))
            }
            into(outputDir)
        }
    }
}

// Find all JARs from the extracted userdev (including embedded libs)
task setupNeoForgeClasspath {
    dependsOn extractNeoForge
    def classpathFile = layout.buildDirectory.file('neoforge-classpath.txt')
    outputs.file(classpathFile)
    
    doLast {
        def neoForgeDir = layout.buildDirectory.dir('neoforge').get().asFile
        def jars = []
        // Include the main userdev JAR and any embedded dependency JARs
        jars << configurations.neoForge.singleFile.absolutePath
        fileTree(neoForgeDir).matching { include '**/*.jar' }.files.each { jars << it.absolutePath }
        classpathFile.get().asFile.text = jars.join('\n')
    }
}

compileJava {
    dependsOn setupNeoForgeClasspath
    def classpathFile = layout.buildDirectory.file('neoforge-classpath.txt')
    doFirst {
        classpath = files(classpathFile.get().asFile.readLines().collect { file(it) })
    }
}

jar {
    from sourceSets.main.output
    from 'src/main/resources'
    
    // Include neoforge.mods.toml in the JAR
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    manifest {
        attributes(
            'Specification-Title': mod_name,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': mod_authors
        )
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version   : minecraft_version, minecraft_version_range: '[1.21.1,)',
        neo_version         : neoforge_version, neo_version_range: '[21.0.109,)',
        loader_version_range: '[4,)',
        mod_id              : mod_id, mod_name: mod_name, mod_license: 'MIT',
        mod_version         : mod_version, mod_authors: mod_authors,
        mod_description     : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
