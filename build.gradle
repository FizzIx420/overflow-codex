plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()
    mavenCentral()

    // NeoForge
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases/'
        content {
            includeGroup 'net.neoforged'
            includeGroup 'net.neoforged.neoforge'
        }
    }

    // Minecraft (for detyped/patched)
    maven {
        name = 'Minecraft'
        url = 'https://libraries.minecraft.net/'
    }

    // Mojang
    maven {
        name = 'Mojang'
        url = 'https://maven.neoforged.net/'
    }

    // Ars Nouveau
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'com.hollingsworth'
            includeGroup 'com.hollingsworth.arsnouveau'
        }
    }

    // Curse Maven (for AllTheModium etc.)
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com/'
        allowInsecureProtocol = false
        content {
            includeGroup 'curse.maven'
        }
    }
}

configurations {
    minecraft
}

dependencies {
    // NeoForge - the full development bundle
    minecraft "net.neoforged:neoforge:${neoforge_version}"

    // Ars Nouveau
    implementation "com.hollingsworth.arsnouveau:ars_nouveau-${minecraft_version}:${ars_nouveau_version}"
}

// Make the minecraft configuration extend from implementation so IDEs work
configurations.implementation.extendsFrom(configurations.minecraft)

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version   : minecraft_version, minecraft_version_range: '[1.21.1,)',
        neo_version         : neoforge_version, neo_version_range: '[21.0.109,)',
        loader_version_range: '[4,)',
        mod_id              : mod_id, mod_name: mod_name, mod_license: 'MIT',
        mod_version         : mod_version, mod_authors: mod_authors,
        mod_description     : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.fork = true
    options.forkOptions.jvmArgs += ['-Xmx2G']
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : mod_id,
            'Implementation-Version'  : mod_version,
            'Implementation-Vendor'   : mod_authors,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // Include neoforge.mods.toml and all resources
    from('src/main/resources') {
        include 'META-INF/**'
        include 'assets/**'
        include 'data/**'
    }

    // Exclude source files
    exclude '**/*.java'
}

// Task to list available jars for debugging
task listDeps {
    doLast {
        configurations.minecraft.each { println "MC: ${it}" }
        configurations.compileClasspath.each { println "Compile: ${it}" }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
