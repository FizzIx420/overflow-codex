name: Build Overflow Codex

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build with Gradle
        run: gradle build --no-daemon 2>&1

      - name: List outputs
        run: find build/ -name "*.jar" -exec ls -la {} \;

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: overflow-codex-mod
          path: build/libs/*.jar
          if-no-files-found: warn
