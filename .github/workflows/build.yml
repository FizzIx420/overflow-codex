name: Build Overflow Codex

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Test basic Gradle
        run: |
          chmod +x gradlew
          echo "=== Test 1: gradlew --version ==="
          ./gradlew --version
          echo ""
          echo "=== Test 2: gradlew tasks ==="
          ./gradlew tasks 2>&1
          echo ""
          echo "=== Test 3: gradlew build ==="
          ./gradlew build 2>&1
          echo ""
          echo "=== Test 4: Check for JARs ==="
          find build/ -name "*.jar" -ls 2>/dev/null || echo "No JARs"

