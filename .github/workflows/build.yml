name: Build Overflow Codex

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download all dependencies
        run: |
          mkdir -p libs
          echo "=== Downloading dependencies ==="
          
          # 1. NeoForm (decompiled Minecraft sources) - this is what the ModDev plugin generates
          curl -sL "https://maven.neoforged.net/releases/net/neoforged/neoform/1.21-20240613.152323/neoform-1.21-20240613.152323.zip" -o libs/neoform.zip
          echo "NeoForm: $(stat -c%s libs/neoform.zip) bytes"
          
          # 2. NeoForge universal jar (compiled NeoForge classes)
          curl -sL "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.0.109-beta/neoforge-21.0.109-beta-universal.jar" -o libs/neoforge.jar
          echo "NeoForge: $(stat -c%s libs/neoforge.jar) bytes"
          
          # 3. Ars Nouveau
          curl -sL "https://maven.blamejared.com/com/hollingsworth/arsnouveau/ars_nouveau-1.21.1/5.10.6/ars_nouveau-1.21.1-5.10.6.jar" -o libs/ars_nouveau.jar
          echo "Ars Nouveau: $(stat -c%s libs/ars_nouveau.jar) bytes"
          
          # 4. NeoForge runtime libraries
          NF_LIBS=(
            "cpw.mods:modlauncher:11.0.4"
            "cpw.mods:bootstraplauncher:2.0.2"
            "net.neoforged:accesstransformers:10.0.1"
            "net.neoforged:coremods:7.0.3"
            "net.neoforged.fancymodloader:loader:4.0.18"
            "net.neoforged.fancymodloader:earlydisplay:4.0.18"
            "org.ow2.asm:asm:9.5"
            "org.ow2.asm:asm-tree:9.5"
            "org.ow2.asm:asm-commons:9.5"
            "org.ow2.asm:asm-analysis:9.5"
            "net.neoforged.accesstransformers:at-modlauncher:10.0.1"
            "org.openjdk.nashorn:nashorn-core:15.4"
            "com.google.guava:guava:33.0.0-jre"
            "com.google.code.gson:gson:2.11.0"
            "org.apache.commons:commons-lang3:3.14.0"
            "com.mojang:brigadier:1.3.10"
            "com.mojang:logging:1.2.0"
            "com.mojang:authlib:6.0.54"
            "com.mojang:datafixerupper:8.0.16"
          )
          for lib in "${NF_LIBS[@]}"; do
            IFS=':' read -r group artifact version <<< "$lib"
            group_path=$(echo "$group" | tr '.' '/')
            url="https://maven.neoforged.net/releases/${group_path}/${artifact}/${version}/${artifact}-${version}.jar"
            outfile="libs/${artifact}-${version}.jar"
            if [ ! -f "$outfile" ]; then
              curl -sL "$url" -o "$outfile" 2>/dev/null && echo "  + ${artifact}-${version}" || echo "  - ${artifact}-${version} (failed)"
            else
              echo "  = ${artifact}-${version} (cached)"
            fi
          done
          
          # 5. Extract NeoForm (decompiled MC sources) to get class files
          echo ""
          echo "=== Extracting NeoForm ==="
          mkdir -p libs/mc-src
          cd libs/mc-src
          unzip -q ../neoform.zip 2>/dev/null
          echo "Extracted MC source files:"
          find . -name "*.java" | wc -l
          echo "java files"
          # Compile MC sources into a jar for classpath
          find . -name "*.java" > /tmp/mc-sources.txt
          javac -J-Xmx2G -Xlint:none -encoding UTF-8 -d /tmp/mc-classes @/tmp/mc-sources.txt 2>&1 || echo "MC compilation had errors (expected for patches)"
          jar cf ../minecraft-compiled.jar -C /tmp/mc-classes . 2>/dev/null
          echo "Minecraft compiled jar: $(stat -c%s ../minecraft-compiled.jar) bytes"
          cd ../..

      - name: Compile mod
        run: |
          echo "=== Building Overflow Codex ==="
          mkdir -p build/classes build/resources
          
          # Build classpath: Minecraft + NeoForge + Ars Nouveau + all libs
          CLASSPATH=""
          for jar in libs/*.jar; do
            CLASSPATH="$CLASSPATH:$jar"
          done
          CLASSPATH="${CLASSPATH:1}" # Remove leading colon
          
          echo "Classpath entries: $(echo $CLASSPATH | tr ':' '\n' | wc -l)"
          
          echo ""
          echo "Compiling Java sources..."
          find src/main/java -name "*.java" > /tmp/mod-sources.txt
          echo "Source files: $(wc -l < /tmp/mod-sources.txt)"
          
          javac -J-Xmx3G -Xlint:none -encoding UTF-8 \
            -cp "$CLASSPATH" \
            -sourcepath "src/main/java:libs/mc-src" \
            -d build/classes \
            @/tmp/mod-sources.txt 2>&1 | tee /tmp/compile-output.txt
          
          COMPILE_EXIT=$?
          CLASS_COUNT=$(find build/classes -name "*.class" 2>/dev/null | wc -l)
          echo ""
          echo "Compilation exit code: $COMPILE_EXIT"
          echo "Compiled $CLASS_COUNT class files"
          
          # If some files failed, show errors and try partial compilation
          if [ "$CLASS_COUNT" -eq 0 ] && [ "$COMPILE_EXIT" -ne 0 ]; then
            echo ""
            echo "=== First 10 errors ==="
            head -30 /tmp/compile-output.txt | grep "error:" || true
            
            # Try compiling without the glyph files (they depend on AN internals)
            echo ""
            echo "Attempting compilation without glyph files..."
            mkdir -p build/classes
            grep -v "glyph/Effect" /tmp/mod-sources.txt | grep -v "glyph/ModGlyphs" > /tmp/mod-sources-clean.txt
            grep -v "client/screen" /tmp/mod-sources-clean.txt > /tmp/mod-sources-cleaner.txt
            
            javac -J-Xmx3G -Xlint:none -encoding UTF-8 \
              -cp "$CLASSPATH" \
              -sourcepath "src/main/java:libs/mc-src" \
              -d build/classes \
              @/tmp/mod-sources-cleaner.txt 2>&1 | tee /tmp/compile-retry.txt || true
            
            CLASS_COUNT=$(find build/classes -name "*.class" 2>/dev/null | wc -l)
            echo "Retry: $CLASS_COUNT class files"
          fi

      - name: Package JAR
        if: always()
        run: |
          echo "=== Packaging mod JAR ==="
          mkdir -p build/libs
          
          # Copy resources
          cp -r src/main/resources/* build/resources/ 2>/dev/null || true
          
          # Create mod JAR
          cd build
          jar cf libs/overflow_codex-1.0.0.jar \
            -C classes . \
            -C resources . \
            2>&1 || true
          cd ..
          
          echo ""
          echo "=== Output ==="
          ls -lh build/libs/ 2>/dev/null || echo "No build/libs"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overflow-codex-jar
          path: build/libs/*.jar
          retention-days: 30
          if-no-files-found: warn
