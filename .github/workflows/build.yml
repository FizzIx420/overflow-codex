name: Build Overflow Codex

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test basic Java build
        run: |
          echo "=== Gradle version ==="
          ./gradlew --version --no-daemon
          echo ""
          echo "=== Cat build.gradle ==="
          cat build.gradle
          echo ""
          echo "=== Cat settings.gradle ==="
          cat settings.gradle
          echo ""
          echo "=== Test: ./gradlew tasks --all ==="
          ./gradlew tasks --all --no-daemon 2>&1 | head -100
          echo ""
          echo "=== Test: ./gradlew buildEnvironment --no-daemon 2>&1 ==="
          ./gradlew buildEnvironment --no-daemon 2>&1

      - name: Build
        run: ./gradlew jar --no-daemon --stacktrace 2>&1

      - name: List outputs
        run: find build/ -type f 2>/dev/null | head -20 || echo "No build dir"

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: overflow-codex-mod
          path: |
            build/libs/*.jar
            build/**/*.jar
          if-no-files-found: warn
