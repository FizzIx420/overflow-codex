name: Build Overflow Codex

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache NeoForge
        uses: actions/cache@v4
        with:
          path: libs
          key: nf-cache-neoforge-21.0.109
          restore-keys: nf-cache-

      - name: Download NeoForge userdev
        run: |
          mkdir -p libs
          if [ ! -f libs/neoforge-userdev.jar ]; then
            echo "Downloading NeoForge 21.0.109-beta userdev (~200MB)..."
            curl -sL "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.0.109-beta/neoforge-21.0.109-beta-userdev.jar" -o libs/neoforge-userdev.jar
          fi
          echo "NeoForge userdev: $(du -h libs/neoforge-userdev.jar | cut -f1)"

      - name: Compile mod
        run: |
          echo "=== Compiling Overflow Codex ==="
          mkdir -p build/classes build/resources

          # NeoForge userdev JAR contains all MC + NF deobfuscated classes
          CP="libs/neoforge-userdev.jar"

          # Find all Java source files
          find src/main/java -name "*.java" > /tmp/sources.txt
          echo "Source files: $(wc -l < /tmp/sources.txt)"

          # Compile
          javac -J-Xmx3G -Xlint:none -encoding UTF-8 \
            -cp "$CP" \
            -d build/classes \
            @/tmp/sources.txt 2>&1 | tee /tmp/compile.log

          CLASS_COUNT=$(find build/classes -name "*.class" 2>/dev/null | wc -l)
          echo "Compiled: $CLASS_COUNT class files"

          if [ "$CLASS_COUNT" -eq 0 ]; then
            echo "ERROR: Compilation produced no class files!"
            cat /tmp/compile.log
            exit 1
          fi

          # Copy resources
          cp -r src/main/resources/* build/resources/ 2>/dev/null || true

          # Package into JAR
          mkdir -p build/libs
          (cd build && jar cf libs/overflow_codex-1.0.0.jar -C classes . -C resources .)
          echo ""
          echo "Output JAR:"
          ls -lh build/libs/overflow_codex-1.0.0.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overflow-codex-jar
          path: build/libs/*.jar
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          echo "## Build Result" >> $GITHUB_STEP_SUMMARY
          ls -lh build/libs/*.jar >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No JAR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Compile Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/compile.log >> $GITHUB_STEP_SUMMARY 2>/dev/null
          echo '```' >> $GITHUB_STEP_SUMMARY
