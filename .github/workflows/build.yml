name: Build Overflow Codex
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          distribution: 'zulu'
      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile
        run: |
          set -e
          # The NeoForge userdev jar provides patches + decompiled MC sources.
          # We can't use raw javac - we need NeoForge's toolchain for AT.
          # Instead, use the NeoForge MDK approach: create a minimal NF project,
          # add our source, and compile via their toolchain.
          #
          # Strategy: Download the NF MDK, copy our sources in, build.

          # Get NeoForge MDK (they publish a template)
          echo "=== Downloading NeoForge MDK ==="
          curl -sL "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.0.109-beta/neoforge-21.0.109-beta-mdk.zip" -o /tmp/nf-mdk.zip 2>/dev/null || true
          curl -sL "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.0.109-beta/neoforge-21.0.109-beta-mdk.zip" -o /tmp/nf-mdk.zip 2>/dev/null || true

          # If MDK zip is unavailable, try alternate approach:
          # Use the existing Gradle setup with the moddev plugin (it SHOULD resolve)
          echo "NF MDK size: $(stat -c%s /tmp/nf-mdk.zip 2>/dev/null || echo 0)"

          # Just try compiling with the existing gradle setup + moddev plugin
          # The moddev plugin should handle downloading NF deps and setting up the classpath
          echo "=== Attempting Gradle build ==="
          ./gradlew compileJava --no-daemon --stacktrace 2>&1 | tail -50 || true

          echo ""
          echo "=== Looking for compiled classes ==="
          find build -name "*.class" 2>/dev/null | head -20 || echo "No classes found"
          find . -path "*/classes/*" -name "*.class" 2>/dev/null | head -20 || echo "No classes in project"

          # If Gradle build produced classes, package them with our resources
          CLASSES_DIR=""
          for d in build/classes/java/main build/neoforge/classes/main build/classes; do
            if [ -d "$d" ] && [ "$(find $d -name '*.class' 2>/dev/null | wc -l)" -gt 0 ]; then
              CLASSES_DIR="$d"
              break
            fi
          done
          echo "Classes dir: $CLASSES_DIR"

          if [ -n "$CLASSES_DIR" ]; then
            mkdir -p build/libs
            (cd build && jar cf libs/overflow_codex-1.0.0.jar -C "$CLASSES_DIR" . -C ../resources . 2>/dev/null)
            # Also try including all generated resources
            find src -name "*.json" -o -name "*.png" | zip -@ build/libs/overflow_codex-1.0.0.jar 2>/dev/null || true

            # Fix toml
            cd /tmp && rm -rf tf && mkdir -p tf && cd tf
            jar xf /home/runner/work/overflow-codex/overflow-codex/build/libs/overflow_codex-1.0.0.jar META-INF/neoforge.mods.toml 2>/dev/null || true
            if [ -f "META-INF/neoforge.mods.toml" ]; then
              sed -i 's/\[ods\]\]/[[mods]]/g' META-INF/neoforge.mods.toml
              sed -i 's/^\[dependencies\.\([a-z_]*\)\]$/[[dependencies.\1]]/g' META-INF/neoforge.mods.toml
              head -5 META-INF/neoforge.mods.toml
              jar uf /home/runner/work/overflow-codex/overflow-codex/build/libs/overflow_codex-1.0.0.jar META-INF/neoforge.mods.toml
            fi
            echo "JAR created"
          else
            echo "WARNING: No compiled classes found!"
            # Fallback: try to manually compile without moddev
            echo "=== Fallback: manual compilation ==="
            # This won't have MC classes but let's see what we get
            mkdir -p libs mcf build/classes build/resources

            # Get NeoForge merged classes via userdev
            curl -sL "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.0.109-beta/neoforge-21.0.109-beta-userdev.jar" -o libs/neoforge-userdev.jar
            unzip -o libs/neoforge-userdev.jar joined.lzma 2>/dev/null || true
            if [ -f "libs/joined.lzma" ]; then
              lzma -d libs/joined.lzma 2>/dev/null || true
              if [ -d "libs/joined" ]; then
                (cd libs/joined && jar cf ../mcf/mc-merged.jar .)
              fi
            fi

            # Get NF classes from universal
            curl -sL "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.0.109-beta/neoforge-21.0.109-beta-universal.jar" -o libs/neoforge-universal.jar 2>/dev/null || true

            # Get misc libs
            curl -sL "https://repo1.maven.org/maven2/org/ow2/asm/asm/9.7/asm-9.7.jar" -o libs/asm.jar
            curl -sL "https://repo1.maven.org/maven2/net/minecraft/client/1.21.1/client-1.21.1-srg.jar" -o libs/mc-client-srg.jar 2>/dev/null || true
            curl -sL "https://repo1.maven.org/maven2/net/minecraft/server/1.21.1/server-1.21.1-srg.jar" -o libs/mc-server-srg.jar 2>/dev/null || true
            curl -sL "https://repo1.maven.org/maven2/net/minecraft/joining/1.21.1/joining-1.21.1-srg.jar" -o libs/mc-joining-srg.jar 2>/dev/null || true

            # Remove invalid
            for j in libs/*.jar; do
              [ -f "$j" ] && [ "$(stat -c%s "$j")" -lt 1000 ] && rm -f "$j"
            done

            # Try to compile with whatever we have
            CP=$(ls libs/*.jar mcf/*.jar 2>/dev/null | tr '\n' ':' | sed 's/:$//')
            find src/main/java -name "*.java" > /tmp/src.txt
            grep -v "ArcaneWeaveScreen" /tmp/src.txt > /tmp/src2.txt
            javac -J-Xmx4G -Xlint:none -encoding UTF-8 -cp "$CP" -d build/classes @/tmp/src2.txt 2>&1 | tail -20 || true
            OK=$(find build/classes -name "*.class" | wc -l)
            echo "Manual compile: $OK classes"

            if [ "$OK" -gt 0 ]; then
              mkdir -p build/libs
              (cd build && jar cf libs/overflow_codex-1.0.0.jar -C classes . -C resources . 2>/dev/null)
              cd /tmp && rm -rf tf && mkdir -p tf && cd tf
              jar xf /home/runner/work/overflow-codex/overflow-codex/build/libs/overflow_codex-1.0.0.jar META-INF/neoforge.mods.toml 2>/dev/null || true
              if [ -f "META-INF/neoforge.mods.toml" ]; then
                sed -i 's/\[ods\]\]/[[mods]]/g' META-INF/neoforge.mods.toml
                sed -i 's/^\[dependencies\.\([a-z_]*\)\]$/[[dependencies.\1]]/g' META-INF/neoforge.mods.toml
                jar uf /home/runner/work/overflow-codex/overflow-codex/build/libs/overflow_codex-1.0.0.jar META-INF/neoforge.mods.toml
              fi
            fi
          fi

          echo "=== Final JAR ==="
          ls -lh build/libs/*.jar 2>/dev/null || echo "No JAR produced"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overflow-codex-mod
          path: build/libs/*.jar
          retention-days: 30
          if-no-files-found: warn
