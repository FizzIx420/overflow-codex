name: Build Overflow Codex

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle (no cache - fresh build)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache: 'disabled'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace 2>&1
        env:
          JAVA_TOOL_OPTIONS: "-Xmx3G"

      - name: Show build outputs
        if: always()
        run: |
          echo "=== Build output ==="
          ls -laR build/libs/ 2>/dev/null || echo "No build/libs"
          echo ""
          echo "=== JAR files ==="
          find . -name "*.jar" -not -path "./.git/*" -not -path "./libs/*" -not -path "./gradle/*" 2>/dev/null

      - name: Upload artifact (JAR)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overflow-codex-jar
          path: |
            build/libs/*.jar
            **/build/libs/*.jar
          retention-days: 30
          if-no-files-found: warn

      - name: Build summary
        if: always()
        run: |
          echo "## Build Result" >> $GITHUB_STEP_SUMMARY
          JARS=$(find . -name "*.jar" -not -path "./.git/*" -not -path "./libs/*" -not -path "./gradle/*" 2>/dev/null)
          if [ -n "$JARS" ]; then
            echo "✅ JAR files produced:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ls -lhR build/libs/ >> $GITHUB_STEP_SUMMARY 2>/dev/null
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ No JAR produced. Build may need dependency fixes." >> $GITHUB_STEP_SUMMARY
          fi
