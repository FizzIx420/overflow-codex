name: Build Overflow Codex

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace 2>&1

      - name: List build outputs
        run: find build/ -name "*.jar" -ls 2>/dev/null || echo "No JARs found"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: overflow-codex-mod
          path: build/libs/overflow_codex-*.jar
          if-no-files-found: warn

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Overflow Codex Build #${{ github.run_number }}"
          body: |
            Automated build from commit ${{ github.sha }}
            NeoForge 21.0.109-beta | Minecraft 1.21.1
          files: build/libs/overflow_codex-*.jar
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
