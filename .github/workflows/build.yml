name: Build Overflow Codex

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: 'true'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Show Gradle tasks
        run: ./gradlew tasks --no-daemon 2>&1 || true

      - name: Build with Gradle
        run: |
          ./gradlew build --no-daemon --stacktrace 2>&1
          echo "EXIT_CODE=$?"
        env:
          JAVA_TOOL_OPTIONS: "-Xmx3G"

      - name: Show build outputs
        if: always()
        run: |
          echo "=== Files in build/libs ==="
          find build/libs -type f 2>/dev/null || echo "  (empty or missing)"
          echo ""
          echo "=== All .jar files ==="
          find . -name "*.jar" -not -path "./.git/*" -not -path "./gradle/*" -type f 2>/dev/null || echo "  none"

      - name: Upload artifact (JAR)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overflow-codex-jar
          path: build/libs/*.jar
          retention-days: 30
          if-no-files-found: warn
