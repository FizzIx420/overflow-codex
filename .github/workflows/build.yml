name: Build Overflow Codex

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --info 2>&1 | tail -100

      - name: List all build outputs
        run: find build/ -type f -name "*.jar" -o -name "*.zip" 2>/dev/null; ls -laR build/libs/ 2>/dev/null || echo "No build/libs/"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: overflow-codex-mod
          path: build/libs/*.jar
          if-no-files-found: warn
