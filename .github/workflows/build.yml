name: Build Overflow Codex

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Debug plugin resolution
        run: ./gradlew buildEnvironment --no-daemon --info 2>&1 | head -200

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace 2>&1

      - name: List all build outputs
        run: find build/ -type f 2>/dev/null || echo "No build dir"

      - name: Upload any JARs
        uses: actions/upload-artifact@v4
        with:
          name: overflow-codex-mod
          path: build/libs/*.jar
          if-no-files-found: warn
