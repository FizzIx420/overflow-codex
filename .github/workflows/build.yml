name: Build Overflow Codex

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download dependencies
        run: |
          mkdir -p libs
          echo "=== Downloading dependencies ==="

          # NeoForge universal jar
          curl -sL "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.0.109-beta/neoforge-21.0.109-beta-universal.jar" -o libs/neoforge.jar
          echo "NeoForge: $(du -h libs/neoforge.jar | cut -f1)"

          # Ars Nouveau (v5.9.4.1182 for MC 1.21.1)
          curl -sL "https://maven.blamejared.com/com/hollingsworth/arsnouveau/ars_nouveau-1.21.1/5.9.4.1182/ars_nouveau-1.21.1-5.9.4.1182.jar" -o libs/ars_nouveau.jar
          echo "Ars Nouveau: $(du -h libs/ars_nouveau.jar | cut -f1)"

          # NeoForm (decompiled MC sources - use as sourcepath)
          curl -sL "https://maven.neoforged.net/releases/net/neoforged/neoform/1.21-20240613.152323/neoform-1.21-20240613.152323.zip" -o libs/neoform.zip
          echo "NeoForm: $(du -h libs/neoform.zip | cut -f1)"
          mkdir -p libs/mc-src && cd libs/mc-src && unzip -q ../neoform.zip
          cd ../..
          echo "MC source files: $(find libs/mc-src -name '*.java' | wc -l)"

          # Runtime libraries for compilation
          LIBS=(
            "cpw.mods:modlauncher:11.0.4" "cpw.mods:bootstraplauncher:2.0.2"
            "net.neoforged:accesstransformers:10.0.1" "net.neoforged:coremods:7.0.3"
            "net.neoforged.fancymodloader:loader:4.0.18" "net.neoforged.fancymodloader:earlydisplay:4.0.18"
            "org.ow2.asm:asm:9.5" "org.ow2.asm:asm-tree:9.5" "org.ow2.asm:asm-commons:9.5"
            "net.neoforged.accesstransformers:at-modlauncher:10.0.1"
            "org.openjdk.nashorn:nashorn-core:15.4"
            "com.google.guava:guava:33.0.0-jre" "com.google.code.gson:gson:2.11.0"
            "org.apache.commons:commons-lang3:3.14.0"
            "com.mojang:brigadier:1.3.10" "com.mojang:logging:1.2.0"
            "com.mojang:authlib:6.0.54" "com.mojang:datafixerupper:8.0.16"
            "net.minecraftforge:binarypatcher:1.1.1"
            "net.minecraftforge:installertools:1.5.0"
            "com.google.errorprone:error_prone_annotations:2.23.0"
            "org.jetbrains:annotations:24.1.0"
          )
          for lib in "${LIBS[@]}"; do
            IFS=':' read -r g a v <<< "$lib"; p=$(echo "$g" | tr '.' '/')
            curl -sL "https://maven.neoforged.net/releases/${p}/${a}/${v}/${a}-${v}.jar" -o "libs/${a}-${v}.jar" 2>/dev/null && echo "  + ${a}" || true
          done

          echo ""
          echo "Total JARs: $(ls libs/*.jar 2>/dev/null | wc -l)"

      - name: Compile mod
        run: |
          echo "=== Compiling Overflow Codex ==="
          mkdir -p build/classes build/resources

          # Classpath: all jars
          CP=$(ls libs/*.jar | tr '\n' ':')
          echo "Classpath: $(echo $CP | tr ':' '\n' | wc -l) jars"

          # Compile with MC sources on sourcepath for type resolution
          echo ""
          echo "Compiling..."
          find src/main/java -name "*.java" > /tmp/src.txt
          javac -J-Xmx3G -Xlint:none -encoding UTF-8 \
            -cp "$CP" \
            -sourcepath "src/main/java:libs/mc-src" \
            -d build/classes \
            @/tmp/src.txt 2>&1 | tee /tmp/compile.log || true

          OK=$(find build/classes -name "*.class" | wc -l)
          echo "Compiled: $OK classes"

          # If some failed, try without glyph+screen files (AN API dependencies)
          if [ "$OK" -eq 0 ]; then
            echo "Retrying without glyph/screen (AN dependency)..."
            grep -v -E "(glyph/Effect|glyph/ModGlyphs|client/screen)" /tmp/src.txt > /tmp/src2.txt
            if [ -s /tmp/src2.txt ]; then
              javac -J-Xmx3G -Xlint:none -encoding UTF-8 \
                -cp "$CP" \
                -sourcepath "src/main/java:libs/mc-src" \
                -d build/classes \
                @/tmp/src2.txt 2>&1 | tee /tmp/compile2.log || true
              OK=$(find build/classes -name "*.class" | wc -l)
              echo "Retry: $OK classes"
            fi
          fi

          # Copy resources
          cp -r src/main/resources/* build/resources/ 2>/dev/null || true

          # Package JAR
          mkdir -p build/libs
          (cd build && jar cf libs/overflow_codex-1.0.0.jar -C classes . -C resources . 2>/dev/null)
          echo ""
          echo "Output: $(ls -lh build/libs/ 2>/dev/null)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overflow-codex-jar
          path: build/libs/*.jar
          retention-days: 30
          if-no-files-found: warn

      - name: Build summary
        if: always()
        run: |
          echo "## Build Result" >> $GITHUB_STEP_SUMMARY
          ls -lh build/libs/*.jar >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No JAR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -30 /tmp/compile.log >> $GITHUB_STEP_SUMMARY 2>/dev/null
          echo '```' >> $GITHUB_STEP_SUMMARY
