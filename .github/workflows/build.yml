name: Build Overflow Codex

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          echo "=== Gradle Version ==="
          ./gradlew --version 2>&1 | head -5
          echo ""
          echo "=== Available Tasks ==="
          ./gradlew tasks --all --no-daemon 2>&1 | head -40
          echo ""
          echo "=== Running Build ==="
          ./gradlew build --no-daemon --stacktrace 2>&1
          echo ""
          echo "=== Exit code: $? ==="
          echo ""
          echo "=== Build Outputs ==="
          find build/libs -type f 2>/dev/null || echo "No build/libs"
          ls -lhR build/ 2>/dev/null || echo "No build dir"
        env:
          JAVA_TOOL_OPTIONS: "-Xmx3G"

      - name: Upload artifact (JAR)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overflow-codex-jar
          path: build/libs/*.jar
          retention-days: 30
          if-no-files-found: warn
